name: Build Translation Dictionary

on:
  workflow_dispatch:
    inputs:
      version:
        description: '빌드할 게임 버전'
        required: true
        default: 'both'
        type: choice
        options:
          - poe1
          - poe2
          - both

jobs:
  build:
    runs-on: ubuntu-latest
    # 저장소 기본 토큰은 읽기 전용이다 — 마지막 단계가 빌드 결과를 push 한다
    permissions:
      contents: write

    # 사전 소스는 poe-game-data(공개) — lock 태그 그대로 받는다. 이 태그가 아니면 build 가 snapshot 검사에서 멈춘다.
    # package-lock.json 은 .gitignore 대상이라 npm ci 를 쓸 수 없다.
    env:
      POE_GAME_DATA_ROOT: ${{ github.workspace }}/poe-game-data

    steps:
      - name: Checkout dictionary repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Read poe-game-data lock
        id: lock
        run: echo "tag=$(node -p "require('./poe-game-data.lock.json').tag")" >> "$GITHUB_OUTPUT"

      - name: Checkout poe-game-data (lock tag)
        uses: actions/checkout@v4
        with:
          repository: west-duo/poe-game-data
          ref: ${{ steps.lock.outputs.tag }}
          path: poe-game-data

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Test
        run: npx vitest run

      - name: Build dictionary
        run: |
          if [ "${{ inputs.version }}" = "both" ]; then
            node scripts/build.js
          else
            node scripts/build.js --version ${{ inputs.version }}
          fi

      - name: Show build report
        run: |
          echo "## Build Report" >> $GITHUB_STEP_SUMMARY
          for f in reports/build-report-*.json; do
            if [ -f "$f" ]; then
              echo "### $(basename $f)" >> $GITHUB_STEP_SUMMARY
              echo '```json' >> $GITHUB_STEP_SUMMARY
              cat "$f" >> $GITHUB_STEP_SUMMARY
              echo '```' >> $GITHUB_STEP_SUMMARY
            fi
          done

      - name: Show diff stats
        run: |
          echo "## File Changes" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          git diff --stat >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Commit and push
        run: |
          git config user.name "서민욱"
          git config user.email "alsdnr0712@gmail.com"
          git add v2/ reports/
          if git diff --cached --quiet; then
            echo "변경사항 없음, 커밋 건너뜀"
          else
            git commit -m "chore: v2 사전 빌드 (${{ inputs.version }}) - $(date -u +%Y-%m-%d)"
            git push
          fi
